name: Publish to crates.io

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches crate version
        run: |
          tag="${{ github.event.release.tag_name }}"
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "uniswap-v3-rs") | .version')
          if [ "${tag#v}" != "$version" ]; then
            echo "::error::Release tag $tag does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - run: cargo publish -p uniswap-v3-rs --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
